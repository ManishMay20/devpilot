# Ollama Configuration (Local & Free)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2:1b

# Gemini aur OpenAI auto-config ko dev me ignore karein
spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.google.genai.autoconfigure.GoogleGenAiAutoConfiguration